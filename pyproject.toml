[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "karpo-apple-silicon"
dynamic = ["version"]
description = "Unofficial port that lets the Karpo Decision models (Gemma family) run on Apple Silicon"
readme = "README.md"
authors = [{name = "FluxCode Studio"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["torch>=2.15"]
keywords = [
    "karpo", "karpo-decision", "karpo-decision-31B", "karpo-decision-12B", "machinepulse",
    "apple-silicon", "macos", "mac", "mps", "metal", "mlx", "pytorch", "gemma", "gemma-4",
    "decision-model", "sliding-window-attention", "flash-attention", "quantization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/fluxcodestudio/karpo-apple-silicon"
Repository = "https://github.com/fluxcodestudio/karpo-apple-silicon"
Changelog = "https://github.com/fluxcodestudio/karpo-apple-silicon/blob/main/CHANGELOG.md"
Issues = "https://github.com/fluxcodestudio/karpo-apple-silicon/issues"
"Karpo Decision (upstream)" = "https://github.com/machinepulse-ai/karpo-decision"
"Karpo Decision 31B weights" = "https://huggingface.co/MachinePulseAI/karpo-decision-31B"
"Karpo Decision 12B weights" = "https://huggingface.co/MachinePulseAI/karpo-decision-12B"

[project.optional-dependencies]
# mlx.py builds on mlx-lm's Gemma 4 classes, which are not a stable interface: only the checked minor is allowed.
# safetensors is what scripts/convert_mlx.py reads a checkpoint with.
mlx = ["mlx>=0.32", "mlx-lm>=0.32,<0.33", "safetensors>=0.4"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.17,<0.18"]

[tool.ruff]
line-length = 120
target-version = "py312"
# A karpo-decision checkout, where CI and scripts/check_upstream_suite.py put one: not this project's code.
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.setuptools]
packages = ["karpo_apple_silicon"]

[tool.setuptools.dynamic]
version = {attr = "karpo_apple_silicon.__version__"}
