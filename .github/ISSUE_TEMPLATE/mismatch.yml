name: An answer differs from an NVIDIA GPU
description: Report a difference beyond the README's measured differences.
title: "Mismatch: "
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: State and questions, or a reduced request that still shows the difference.
    validations:
      required: true
  - type: textarea
    id: responses
    attributes:
      label: Both responses
      description: Include both responses and their probabilities.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Checkpoint and Mac
      description: Which checkpoint, whether you converted to float16, and your Mac model and memory.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Package versions
      description: 'Output of pip list | grep -i -E "karpo|torch|transformers|mlx"'
    validations:
      required: true
